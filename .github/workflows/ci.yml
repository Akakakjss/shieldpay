name: Test working product
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shieldpay-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SHIELDPAY_MODE: demo
      SHIELDPAY_AI: onnx
      SHIELDPAY_TEST_ONNX: '1'
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install, run Python and React tests, build real frontend
        run: python scripts/run.py --check
      - name: Install browser for functional and accessibility checks
        working-directory: frontend
        run: npx playwright install --with-deps chrome
      - name: Browser against actual isolated HTTP backend
        working-directory: frontend
        run: npm run test:browser
      - name: Protected sandbox-shaped importer against actual HTTP backend
        run: node scripts/verify_import_browser.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: synthetic-browser-evidence
          path: frontend/test-artifacts/
          retention-days: 7
